<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="description" content="A calm, simple space to track study sessions, subjects, and tasks." />
    <title>StuTrak — your study space</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="StuTrak home">
          <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" /><path d="m9 10 2 2 4-4" /></svg></span>
          <span class="brand-name">stu<span>trak</span></span>
        </a>
        <p class="sidebar-label">Workspace</p>
        <nav id="sidebar-nav" class="sidebar-nav" aria-label="Main navigation"></nav>
        <div class="sidebar-spacer"></div>
        <aside class="sidebar-tip">
          <span class="tip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z" /></svg></span>
          <strong>Small steps, big progress.</strong>
          <p>Every study session brings you closer to your goals.</p>
        </aside>
        <p class="sidebar-footer">Your study space, just for you.</p>
      </aside>
      <main class="main-area">
        <header class="topbar">
          <h1 id="page-title">Overview</h1>
          <div class="topbar-right">
            <span class="today-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M16 3v4M8 3v4M3 11h18" /></svg><span id="current-date"></span></span>
            <span class="avatar" aria-label="Student profile">S</span>
          </div>
        </header>
        <div id="page-content" class="page-content"></div>
      </main>
      <div id="modal-root" class="modal-root"></div>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
